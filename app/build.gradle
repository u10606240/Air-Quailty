plugins {
    id 'com.android.application'
}
def bundleName
def variantType
def getVersion() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('version.properties').newDataInputStream())
    return properties.getProperty("VERSION_CODE")
}
//修改输出APK包名
android.applicationVariants.all { variant ->
    variantType = variant.buildType.name
    variant.outputs.each { output ->
        variant.outputs.all {
//        outputFileName = "${variant.name}-${variant.versionName}.apk"
            bundleName = "AirQuality" + "-" + getVersion()
            outputFileName = bundleName + '.aab'
        }
    }
}
android {
    compileSdk 34

    defaultConfig {
        applicationId "com.ttu.airquality"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
//        buildConfigField "String", "VERSION", "\"" + getVersion() + "\""
        setProperty("archivesBaseName", "${applicationId}-v${versionName}")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {

//        debug {
//            storeFile file('.\\key\\default.jks')
//            storePassword '123456'
//            keyAlias 'key0'
//            storePassword '123456'
//            keyPassword '123456'
//        }
        release {
            storeFile file('C:\\Users\\Winnie\\Desktop\\AirQuality\\key\\default.jks')
            storePassword '123456'
            keyAlias 'key0'
            keyPassword '123456'
        }
